name: Index and discussions

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'verified.json'
      - 'builtins.json'
      - 'scripts/**'
      - '.github/workflows/discussions.yml'
  workflow_dispatch:

# The job rewrites index.json and opens or edits one Discussion per template.
permissions:
  contents: write
  discussions: write

concurrency:
  group: templates-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      # The push at the end goes through a write deploy key: main requires the
      # validate check, and GITHUB_TOKEN has no way past that.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate every envelope
        run: node scripts/validate.mjs

      - name: Build the index
        run: node scripts/build-index.mjs

      # Creates a thread for a new slug, edits the body of one that moved, and
      # writes each discussion number back into index.json for giscus.
      # The Actions token can open a discussion but is refused updateDiscussion,
      # so this step runs on a fine-grained token with Discussions read and write.
      - name: Create or update the discussions
        env:
          GITHUB_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-discussions.mjs

      - name: Commit the index
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "rebuild the template index"
          git push
